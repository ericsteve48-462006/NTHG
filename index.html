<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essential+Essential+</title>
    <meta
      name="description"
      content="A collection of intentionally useless and absurd everyday apps."
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main id="landing-page" class="landing-page">
        <div class="landing-copy">
          <p class="eyebrow">A tiny collection of questionable tools</p>
          <h1>Essential<span>+</span>Essential<span>+</span></h1>
          <p class="landing-description">
            Everything you need for absolutely nothing. Meet the most unnecessary toolkit on the internet.
          </p>
          <button id="enter-app" class="landing-cta" type="button">
            Enter the useless toolkit <span aria-hidden="true">→</span>
          </button>
          <p class="landing-note">No account. No productivity. No guarantees.</p>
        </div>
        <div class="landing-orbit" aria-hidden="true">
          <div class="orbit-ring orbit-ring-one"></div>
          <div class="orbit-ring orbit-ring-two"></div>
          <div class="orbit-core">∅</div>
          <span class="orbit-label orbit-label-one">CALC</span>
          <span class="orbit-label orbit-label-two">TIME</span>
          <span class="orbit-label orbit-label-three">VIBES</span>
        </div>
      </main>

      <div id="app-view" class="app-view hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">Unnecessary tools</p>
            <h2>Essential+Essential+</h2>
          </div>
          <div class="topbar-actions">
            <span class="badge">Technically works</span>
            <button id="back-to-landing" class="back-button" type="button">← Start over</button>
          </div>
        </header>
        <main id="app-root" class="app-grid"></main>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
